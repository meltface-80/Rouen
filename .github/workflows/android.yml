name: Android

# Rouen for Android (dev/design/android-app.md §4.8): the APK, built from android/ on every
# push that touches it, kept as the run's artifact. Modelled on Mandarin's android.yml.
#
# The built-in Tailscale engine (§4.7) is musicdnet/ at the repository's root, the same Go
# program as Mandarin's: built here for Android on 64-bit ARM into the APK's jniLibs as
# libmusicdnet.so, which the app runs from its nativeLibraryDir.
#
# On a push to dev the APK is also attached to the rolling `test-android` pre-release, under
# one fixed file name (replaced each time, so copies never pile up); its label carries the
# version. The release is created once, never edited (`gh release edit` would fire
# latest.yml's `edited` trigger), never Latest, and its tag is not a version, so neither the
# in-app updater nor the image workflows ever take it for one. No APK is ever committed.
#
# The app updates itself (§4.12, AppUpdate.kt) from a JSON beside the APK — {version, url,
# sha256}, never committed: rouen-android-test.json on test-android (each dev push), and, when
# release.yml calls this with release: true on a merge to main, rouen-android.apk and
# rouen-android.json on that version's release (skipped when it carries them already).
#
# versionName is Rouen's package.json version; versionCode comes from it too (§4.12):
# major×10⁷ + minor×10⁵ + patch×10² + N for X.Y.Z-tN, + 99 for a release — so a release built
# by another workflow still installs over the test builds before it. Signing: the ROUEN_KEYSTORE_BASE64 / ROUEN_KEYSTORE_PASSWORD
# secrets when set, otherwise the debug key committed at android/app/rouen-debug.keystore.
on:
  push:
    branches: ["**"]
    paths: ["android/**", "musicdnet/**", ".github/workflows/android.yml"]
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: "Attach the APK and its JSON to the release of package.json's version (release.yml)"
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # the test-android pre-release, on dev only
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Version from package.json
        id: v
        working-directory: .
        run: |
          set -e
          version=$(node -p "require('./package.json').version")
          code=$(node -e '
            const m = /^(\d+)\.(\d+)\.(\d+)(?:-t(\d+))?$/.exec(process.argv[1]);
            if (!m || +m[2] > 99 || +m[3] > 999 || (m[4] && +m[4] > 98)) { console.error("no versionCode for " + process.argv[1]); process.exit(1); }
            console.log(m[1] * 1e7 + m[2] * 1e5 + m[3] * 100 + (m[4] ? +m[4] : 99));' "$version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Rouen for Android $version, versionCode $code"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Mandarin's package list. The NDK and CMake build libopus and Media3's Opus decoder
      # (android/app/src/main/cpp); the versions match android/app/build.gradle.kts.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1'

      - uses: actions/setup-go@v5
        with:
          go-version-file: musicdnet/go.mod
          cache-dependency-path: musicdnet/go.sum

      # As Mandarin's workflow builds it: plain Go, no NDK (Android on 64-bit ARM links without C tools).
      - name: Build the Tailscale engine
        working-directory: musicdnet
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -e
          mkdir -p ../android/app/src/main/jniLibs/arm64-v8a
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X main.version=$VERSION" \
            -o ../android/app/src/main/jniLibs/arm64-v8a/libmusicdnet.so .
          ls -la ../android/app/src/main/jniLibs/arm64-v8a/

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore the signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ROUEN_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "have_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ROUEN_KEYSTORE_BASE64 is not set: signed with the committed debug key (updates install in place)."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rouen-release.jks"
          echo "path=$RUNNER_TEMP/rouen-release.jks" >> "$GITHUB_OUTPUT"
          echo "have_key=true" >> "$GITHUB_OUTPUT"

      # The home-or-away rules (android/app/src/test), on the JVM.
      - name: Unit tests
        run: ./gradlew :app:testReleaseUnitTest --no-daemon --stacktrace

      - name: Assemble
        env:
          ROUEN_KEYSTORE: ${{ steps.signing.outputs.path }}
          ROUEN_KEYSTORE_PASSWORD: ${{ secrets.ROUEN_KEYSTORE_PASSWORD }}
          VERSION: ${{ steps.v.outputs.version }}
          CODE: ${{ steps.v.outputs.code }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace -ProuenVersionName="$VERSION" -ProuenVersionCode="$CODE"

      - name: Name the APK after the version
        id: name
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -e
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          [ -n "$apk" ] || { echo "::error::no APK was built"; exit 1; }
          out="Rouen-Android-${VERSION}.apk"
          cp "$apk" "$out"
          ls -la "$out"
          # The engine must be in the APK, where the app runs it from.
          unzip -l "$out" | grep -q 'lib/arm64-v8a/libmusicdnet.so' || { echo "::error::libmusicdnet.so is not in the APK"; exit 1; }
          echo "apk=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.apk }}
          path: android/${{ steps.name.outputs.apk }}
          if-no-files-found: error

      - name: Publish dev's APK to the test-android pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.name.outputs.apk }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -e
          if ! gh release view test-android >/dev/null 2>&1; then
            gh release create test-android --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Rouen for Android (test build)" \
              --notes "Rouen for Android, built from the dev branch: the newest test build replaces the APK below each time (its label names the version). For testing only; not a release."
          fi
          cp "android/$APK" rouen-android-test.apk
          node -e 'const [v, s] = process.argv.slice(1); console.log(JSON.stringify({ version: v, sha256: s,
            url: "https://github.com/meltface-80/Rouen/releases/download/test-android/rouen-android-test.apk" }))' \
            "$VERSION" "$(sha256sum rouen-android-test.apk | cut -d' ' -f1)" > rouen-android-test.json
          cat rouen-android-test.json
          # The APK first, then the JSON that names it: an app never reads a JSON whose APK is not there yet.
          gh release upload test-android "rouen-android-test.apk#$APK" --clobber
          gh release upload test-android rouen-android-test.json --clobber

      - name: Attach the APK to this version's release
        if: inputs.release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.name.outputs.apk }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -e
          TAG="v$VERSION"
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx rouen-android.json; then
            echo "$TAG carries the app already"; exit 0
          fi
          cp "android/$APK" rouen-android.apk
          node -e 'const [t, s] = process.argv.slice(1); console.log(JSON.stringify({ version: t.slice(1), sha256: s,
            url: "https://github.com/meltface-80/Rouen/releases/download/" + t + "/rouen-android.apk" }))' \
            "$TAG" "$(sha256sum rouen-android.apk | cut -d' ' -f1)" > rouen-android.json
          gh release upload "$TAG" rouen-android.apk --clobber
          gh release upload "$TAG" rouen-android.json --clobber
